{% extends 'base.html' %}

{% block content %}

<style>
    /* LOGIN CONTAINER */
    .login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 60px);
    }

    .box {
        background: rgba(255, 255, 255, 0.95);
        padding: 30px;
        width: 320px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        text-align: center;
        backdrop-filter: blur(5px);
    }

    .box h2 {
        margin-bottom: 20px;
        color: #0077b6;
    }

    .box input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 8px;
    }

    .box button {
        width: 100%;
        padding: 10px;
        background: #0077b6;
        border: none;
        color: white;
        border-radius: 8px;
        cursor: pointer;
    }

    .box button:hover {
        background: #005f8f;
    }

    .box a {
        display: block;
        margin-top: 10px;
        font-size: 14px;
        color: #0077b6;
    }
</style>

<div class="login-container">

    <div class="box">
        <h2>Healthcare Login</h2>

        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">Login</button>
        </form>

        <a href="/register">Create Account</a>
    </div>

</div>

{% endblock %}
