<!DOCTYPE html>
<html>

<head>
    <title>Register</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                url('/static/images/hospital_pic.jpg') no-repeat center center/cover;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            width: 340px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .form-container h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .form-container input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .form-container button {
            width: 100%;
            padding: 12px;
            background: #2c7be5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        .form-container button:hover {
            background: #1a5fd1;
        }

        .form-container a {
            display: block;
            margin-top: 15px;
            color: #2c7be5;
            text-decoration: none;
            font-size: 14px;
        }

        /* ERROR MESSAGE STYLE */
        .error {
            color: white;
            background: #e74c3c;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="form-container">

        <h2>Create Account</h2>

        <!-- ERROR MESSAGE -->
        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <input type="text" name="fullname" placeholder="Full Name" required>
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <input type="text" name="role" placeholder="Role (admin/user)" required>

            <button type="submit">Register</button>
        </form>

        <a href="/login">Already have an account?</a>

    </div>

</body>

</html>
